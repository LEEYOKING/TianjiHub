# Netlify 部署配置 — 天机枢 v2.0.7
# 部署步骤见 ./NETLIFY_DEPLOY.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # 数据源开关(留空即可,默认走 public/data.json)
  VITE_DATA_URL = ""

# SPA 路由 fallback:刷新页面时 /overview /prescan 等直接命中 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JSON 数据缓存(短,5 分钟)
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# 安全头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
