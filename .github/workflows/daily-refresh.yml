name: Daily Data Refresh

# 交易日盘后云端自动刷新：不依赖本机开机。
# cron 为 UTC 时间（注释里是北京时间）：
#   35 7  * * 1-5  → 15:35 收盘快照
#   35 10 * * 1-5  → 18:35 龙虎榜 18:00 披露后补跑
#   30 0  * * 1-5  → 08:30 次日早晨：只补抓融资融券终值（不加交易日门槛，假期工作日也要跑）
#    0 14 * * 1-5  → 22:00 ★补跑档：只有关键数据仍是"过期"时才真正跑全流程
#    0 22 * * 1-5  → 次日 06:00 ★补跑档：同上（用来发现/补救前一交易日整档漏跑）
# 也支持手动触发 workflow_dispatch（Actions 页 → Run workflow）。
#   注意：交易日 09:30~15:00（盘中）会被脚本拒绝执行，避免把盘中快照当收盘数据写进 data.json。
#
# 为什么加"补跑档 + 新鲜度校验"（2026-10-14 实测事故）：
#   · 免费 cron 延迟极严重：应 15:35 跑的实测拖到 23:13，应 18:35 的拖到次日 01:45；
#   · 海外 IP 抓国内财经接口会被风控，盘后档整档失败时，失败原本是**静默**的
#     （轮动归档步骤带 continue-on-error，job 仍显示绿色，线上只表现为"报告日期不动"）；
#   · 现在由 scripts/check_freshness.py 统一定夺：提前决定要不要跑，收尾校验是否真的是盘后快照，
#     不满足就 exit 1 让 job 变红 —— 断供不再是无声的。
on:
  schedule:
    - cron: '35 7 * * 1-5'
    - cron: '35 10 * * 1-5'
    - cron: '30 0 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 45 分钟：补跑档可能要在同一次里跑完「行情 + 手术台 + 轮动」（轮动单步上限 20 分钟）
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 任务规划：判断交易日 / 盘中保护 / 是否需要补跑，输出 mode
      #   margin    = 只跑 08:30 融资补抓（与既有行为完全一致）
      #   postclose = 跑完整盘后流程（行情 + 手术台 + 轮动归档）
      #   skip      = 什么都不跑（盘中 / 非交易日且数据不旧 / 补跑档但数据已新鲜）
      - name: 任务规划（交易日 / 盘中保护 / 补跑判定）
        id: plan
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: NO_PROXY="*" no_proxy="*" python3 scripts/check_freshness.py --plan

      - name: 次日早晨补抓融资融券(仅 08:30 那档)
        if: steps.plan.outputs.mode == 'margin'
        run: NO_PROXY="*" no_proxy="*" python3 scripts/backfill_margin.py

      - name: 拉取盘后数据
        if: steps.plan.outputs.mode == 'postclose'
        run: NO_PROXY="*" no_proxy="*" python3 scripts/fetch_real_data.py

      # 本档不跑轮动时显式标记 —— 否则收尾的「数据新鲜度校验」会把"归档过期"算到这一档头上，
      # 让 08:30 融资补抓档这类本来不碰轮动的运行无故变红。
      # Settings → Variables 里设 ROTATION_ENABLED=false 可临时完全停掉对东财的请求
      # （出口 IP 被风控期间，每次触发都在给封禁续期）。
      - name: 标记轮动未尝试
        if: steps.plan.outputs.mode != 'postclose' || vars.ROTATION_ENABLED == 'false'
        run: echo "ROT_RC=notrun" >> "$GITHUB_ENV"

      - name: 拉取手术台数据(封成比评分/亏钱传导/北向)
        if: steps.plan.outputs.mode == 'postclose'
        run: |
          NO_PROXY="*" no_proxy="*" python3 scripts/fetch_surgery_data.py || \
            echo "! 手术台数据拉取失败(海外 IP 风控),本次跳过"

      # 板块轮动归档(public/rotation.json) —— 2026-10-28 起改抓同花顺:
      #   东财 push2/push2his 对住宅 IP 与 Runner 海外 IP 一律 0.2s RST
      #   (10-22~10-27 连续 6 个交易日 0 产出),换域名 / 换 IPv6 / 换协议都无效;
      #   同花顺板块日线是静态 CDN(无 cookie、无签名),实测 417 个板块全部 200、0.2s/板。
      #   每次全量重建 120 天窗口(417 请求 / ~45s):接口给 140 根 > 120 天,天然幂等,
      #   不会像增量拼接那样把缺口越滚越大。
      # continue-on-error 会把本步失败"连结论一起抹掉",故仍由收尾 gate 判红:
      #   退出码 4(数据源整体不可达)降级为告警,覆盖不足(1) / 超时被杀(空)才判红。
      - name: 拉取板块轮动历史归档（同花顺单源，每日全量重建 120 天）
        if: steps.plan.outputs.mode == 'postclose' && vars.ROTATION_ENABLED != 'false'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export NO_PROXY="*" no_proxy="*"
          set +e
          python3 scripts/fetch_rotation_ths.py --days 120
          rc=$?
          # 把退出码传给收尾的「数据新鲜度校验」:4=数据源整体不可达(重试无意义)→ 只告警不判红
          echo "ROT_RC=$rc" >> "$GITHUB_ENV"
          if [ $rc -eq 4 ]; then
            echo "::warning::同花顺板块日线不可达 → 轮动归档本次跳过，不判为失败"
          fi
          exit $rc

      - name: 提交并推送
        # 早晨补抓档不设交易日门槛(假期工作日也要提交);其余档由 plan 的 mode 决定
        if: steps.plan.outputs.mode != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/surgery.json public/prescan.json
          # 板块轮动归档(存在才 add,避免脚本失败时报错)
          [ -f public/rotation.json ] && git add public/rotation.json || true
          if git diff --cached --quiet; then
            echo "无数据变化,跳过提交"
            exit 0
          fi
          git commit -m "盘后刷新数据 $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $i 次推送失败,尝试同步后重试"
            git pull --rebase origin main || true
            sleep 10
          done
          echo "推送失败"
          exit 1

      # ★数据新鲜度校验（失败可见化）
      # 必须放在最后一步、并用 always()：即使前面有步骤失败或被 continue-on-error 吞掉，也要做判定。
      # 校验三点：关键数据的日期是否=最近该完成的交易日；生成时点是否落在盘中（不是盘后快照）。
      # 不满足即 exit 1，让这次 run 标红 —— 这样"断供"会立刻显形，而不是等你发现报告日期不动。
      - name: 数据新鲜度校验（过期即失败，避免静默断供）
        if: always() && steps.plan.outputs.mode != 'skip'
        env:
          ROT_RC: ${{ env.ROT_RC }}
        run: python3 scripts/check_freshness.py --gate
