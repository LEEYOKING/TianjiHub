# Cloudflare Worker：准点触发 GitHub Actions 的 Daily Data Refresh
# 部署：cd cloudflare/cron-trigger && npx wrangler deploy
# 密钥：npx wrangler secret put GITHUB_TOKEN（fine-grained PAT，需 Actions: Read and write）
#
# cron 一律 UTC，对应北京时间（具体时点在 src/index.js 的 SLOTS 里）：
#   07:10 / 07:40 / 08:10 → 15:10 / 15:40 / 16:10 收盘档（后两档带新鲜度判断，已更新就跳过）
#   10:05                → 18:05 龙虎榜档
#   13:30                → 21:30 融资档
#   14:10                → 22:10 收盘兜底（当天快照到 24 点前都有效）
#
# ⚠ Cloudflare 免费账户整账户最多 5 条 cron 触发器，所以这里只注册 1 条：
#   UTC 07:00~14:55 每 5 分钟跑一次，由 src/index.js 判断是否命中上面那些时点，
#   未命中直接返回、不会调 GitHub。
name = "tianjihub-cron"
main = "src/index.js"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/5 7-14 * * 1-5"]
