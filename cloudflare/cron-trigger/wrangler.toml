# Cloudflare Worker：准点触发 GitHub Actions 的 Daily Data Refresh
# 部署：cd cloudflare/cron-trigger && npx wrangler deploy
# 密钥：npx wrangler secret put GITHUB_TOKEN（fine-grained PAT，仅需 Actions: write）
#
# cron 一律 UTC，对应北京时间：
#   35 7  → 15:35 收盘核心档（行情 + 板块轮动 + 日历，约 15:45 前上线）
#    5 10 → 18:05 龙虎榜档（18:00 披露后）
#   30 13 → 21:30 融资档（交易所余额当晚定稿后）
#
# ⚠ Cloudflare 免费账户整账户最多 5 条 cron 触发器，所以这里只注册 1 条：
#   UTC 07:00~13:55 每 5 分钟跑一次，由 src/index.js 判断是否命中上面三个时点，
#   未命中直接返回、不会调 GitHub。命中时点与这三个完全一致。
name = "tianjihub-cron"
main = "src/index.js"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/5 7-13 * * 1-5"]
