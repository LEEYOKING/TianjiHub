# Cloudflare Worker：准点触发 GitHub Actions 的 Daily Data Refresh
# 部署：cd cloudflare/cron-trigger && npx wrangler deploy
# 密钥：npx wrangler secret put GITHUB_TOKEN（fine-grained PAT，仅需 Actions: write）
#
# cron 一律 UTC，对应北京时间：
#   35 7  * * 1-5 → 15:35 收盘核心档（行情 + 板块轮动 + 日历，约 15:45 前上线）
#    5 10 * * 1-5 → 18:05 龙虎榜档（18:00 披露后）
#   30 13 * * 1-5 → 21:30 融资档（交易所余额当晚定稿后）
name = "tianjihub-cron"
main = "src/index.js"
compatibility_date = "2026-11-01"

[triggers]
crons = ["35 7 * * 1-5", "5 10 * * 1-5", "30 13 * * 1-5"]
